<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Device Mockup Preview</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        /* Realistic Phone Frame Outer Bezel */
        .phone-container {
            width: 390px;
            height: 844px;
            background-color: #000000;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0px 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 4px solid #333333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Realistic Android Top Status Bar */
        .status-bar {
            height: 32px;
            background-color: #000000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 12px;
            font-weight: 500;
            user-select: none;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .volte-tag {
            font-size: 9px;
            border: 1px solid #ffffff;
            padding: 1px 3px;
            border-radius: 3px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Icons using native SVG code for crisp rendering */
        .icon {
            width: 14px;
            height: 14px;
            fill: #ffffff;
        }

        /* App Display Frame Area */
        .screen-content {
            flex: 1;
            background-color: #11141a;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Embedded App Iframe Container */
        .app-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: transparent;
        }

        /* Realistic Android Bottom Software Keys Navigation Bar */
        .navigation-bar {
            height: 48px;
            background-color: #000000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 30px;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
        }

        .nav-button {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .nav-button:hover {
            opacity: 1;
        }

        .nav-icon {
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <!-- Phone Wrapper Shell -->
    <div class="phone-container">
        
        <!-- Top Status Bar Section -->
        <div class="status-bar">
            <div class="status-left">
                <span class="volte-tag">VoLTE</span>
                <span>14:12</span>
            </div>
            <div class="status-right">
                <!-- Eye Protect / Comfort Mode icon indicator -->
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-2a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>
                <!-- Cellular Signal Icon -->
                <svg class="icon" viewBox="0 0 24 24"><path d="M2 22h20V2z"/></svg>
                <!-- Battery Level Icon with Percentage indicator text matching screenshot -->
                <span>89</span>
                <svg class="icon" viewBox="0 0 24 24" style="transform: rotate(90deg); width: 16px;"><path d="M17 5H3a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zM23 9v6"/></svg>
            </div>
        </div>

        <!-- Central Phone Viewport Workspace -->
        <div class="screen-content">
            <!-- REPLACE THE SRC LINK BELOW WITH YOUR APPLICATION DEPLOYMENT OR LOCALHOST LINK -->
            <iframe class="app-iframe" src="http://localhost:3000" title="Dugout Pulse"></iframe>
        </div>

        <!-- Android Classic 3-Button Software Navigation Bar -->
        <div class="navigation-bar">
            <!-- App Switcher (Square) Button -->
            <button class="nav-button" aria-label="Recent Apps">
                <svg width="16" height="16" viewBox="0 0 24 24">
                    <rect class="nav-icon" x="3" y="3" width="18" height="18" rx="2" />
                </svg>
            </button>
            
            <!-- Home (Circle) Button -->
            <button class="nav-button" aria-label="Home">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <circle class="nav-icon" cx="12" cy="12" r="9" />
                </svg>
            </button>
            
            <!-- Back (Triangle) Button -->
            <button class="nav-button" aria-label="Back">
                <svg width="16" height="16" viewBox="0 0 24 24" style="transform: rotate(-90deg);">
                    <polygon class="nav-icon" points="12,2 2,22 22,22" />
                </svg>
            </button>

            <!-- Keyboard Dismiss / Extra Dropdown Feature Key -->
            <button class="nav-button" aria-label="Dismiss">
                <svg width="16" height="16" viewBox="0 0 24 24">
                    <polyline class="nav-icon" points="6,9 12,15 18,9" />
                </svg>
            </button>
        </div>
    </div>
</body>
</html>
