<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Preview</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1f2933;
        height: 100vh;
        display: flex;
        overflow: hidden;
    }

    /* ---------- Left control panel (fixed) ---------- */
    .sidebar {
        width: 250px;
        flex: none;
        height: 100vh;
        overflow-y: auto;
        background: #f6f8fa;
        border-right: 1px solid #e1e5ea;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 22px;
    }
    .sidebar h1 { font-size: 16px; font-weight:600; }
    .group-title {
        font-size: 11px; font-weight:600; letter-spacing: .08em;
        text-transform: uppercase; color: #6b7785; margin-bottom: 8px;
    }
    .btn-col { display: flex; flex-direction: column; gap: 6px; }
    .btn-row { display: flex; gap: 6px; }
    .btn-row .btn { flex: 1; }

    .btn {
        background: #ffffff;
        border: 1px solid #cfd6de;
        color: #1f2933;
        padding: 9px 12px;
        font-size: 13px;
        border-radius: 8px;
        cursor: pointer;
        text-align: left;
        transition: background .15s, border-color .15s;
    }
    .btn:hover { background: #eef2f6; }
    .btn.active {
        background: #00c2cb; border-color: #00a9b1;
        color: #00262a; font-weight:600;
    }
    .btn.center { text-align: center; }
    .btn.primary { background: #00c2cb; border-color: #00a9b1; color: #00262a; font-weight:600; text-align: center; }
    .btn.primary:hover { background: #00aab2; }

    .url-input {
        width: 100%; padding: 9px 10px; font-size: 13px;
        border: 1px solid #cfd6de; border-radius: 8px; margin-bottom: 6px;
    }
    .check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
    .info { font-size: 12px; color: #6b7785; line-height: 1.6; }
    .info b { color: #1f2933; }

    /* ---------- Stage ---------- */
    .stage {
        flex: 1;
        min-width: 0;
        height: 100vh;
        overflow: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        background: #ffffff;
    }
    .scale-wrap { flex: none; position: relative; }
    .scale-inner { transform-origin: top left; position: absolute; top: 0; left: 0; }

    /* ---------- Device shell ---------- */
    .device {
        background: #000;
        display: flex;
        flex-direction: column;
        position: relative;
        box-shadow: 0 0 0 4px #333, 0 25px 50px -12px rgba(0,0,0,.45);
    }
    .screen {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #000;
        position: relative;
    }
    .bar-top, .bar-bottom { flex: none; background: #000; color: #fff; user-select: none; }
    .app-area { flex: 1; min-height: 0; background: #11141a; position: relative; }
    .app-area iframe { width: 100%; height: 100%; border: none; background: #fff; display: block; }

    /* Status bars */
    .bar-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 500; padding: 0 16px; }
    .bar-top .l, .bar-top .r { display: flex; align-items: center; gap: 7px; }
    .bar-top.tablet { font-size: 13px; }
    .volte { font-size: 8px; background: #fff; color: #000; padding: 1px 3px; border-radius: 3px; font-weight:800; letter-spacing: 0; line-height: 11px; }
    .bar-top.android { padding: 0 8px 0 12px; font-size: 15px; font-weight: 500; }
    .bar-top.android .l { gap: 6px; }
    .bar-top.android .r { gap: 4px; }
    .bar-top.android svg { display: block; flex: none; }
    .net4g { display: flex; align-items: flex-start; gap: 1px; }
    .net4g span { font-size: 7px; font-weight: 800; line-height: 8px; margin-top: 0; }
    .ico { width: 14px; height: 14px; fill: #fff; }

    /* iOS status */
    .bar-top.ios { font-size: 15px; font-weight: 600; padding: 0 34px; align-items: flex-end; padding-bottom: 8px; }
    .bar-top.ipad { font-size: 12px; font-weight: 600; padding: 0 22px; }
    .dyn-island {
        position: absolute; background: #000; z-index: 5; border-radius: 20px;
        box-shadow: inset 0 0 0 1px #1a1a1a;
    }

    /* Android nav */
    .nav-android { display: flex; align-items: center; justify-content: center; padding: 0; }
    .nav-android.tablet { justify-content: center; gap: 0; }
    .nav-btn {
        background: none; border: none; outline: none;
        width: 63px; height: 100%;
        display: flex; align-items: center; justify-content: center;
        position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    /* soft round press highlight, like the real system ripple */
    .nav-btn::before {
        content: ""; position: absolute; width: 40px; height: 40px; border-radius: 50%;
        background: rgba(255,255,255,0); transition: background .12s;
    }
    .nav-btn:active::before { background: rgba(255,255,255,.16); }
    .nav-btn svg { display: block; position: relative; overflow: visible; }
    .nav-ico {
        fill: none; stroke: #ffffff; stroke-width: 1.5;
        stroke-linecap: round; stroke-linejoin: round;
        opacity: .95;
    }

    /* iOS home indicator */
    .nav-ios { display: flex; align-items: center; justify-content: center; }
    .home-pill { background: #fff; border-radius: 3px; opacity: .9; }
</style>
</head>
<body>

<!-- ============ Left controls ============ -->
<aside class="sidebar">
    <h1>Device Preview</h1>

    <div>
        <div class="group-title">Android</div>
        <div class="btn-col">
            <button class="btn" data-device="android-phone">Android Phone</button>
            <button class="btn" data-device="android-tablet">Android Tablet</button>
        </div>
    </div>
    <div>
        <div class="group-title">Huawei</div>
        <div class="btn-col">
            <button class="btn" data-device="huawei-nova-14i">My Phone</button>
        </div>
    </div>

    <div>
        <div class="group-title">Apple</div>
        <div class="btn-col">
            <button class="btn" data-device="iphone">iPhone</button>
            <button class="btn" data-device="ipad">iPad</button>
        </div>
    </div>

    <div>
        <div class="group-title">Orientation</div>
        <div class="btn-row">
            <button class="btn center" data-orient="portrait">Portrait</button>
            <button class="btn center" data-orient="landscape">Landscape</button>
        </div>
        <div class="btn-col" style="margin-top:6px">
            <button class="btn center" id="rotateBtn">🔄 Rotate</button>
        </div>
    </div>

    <div>
        <div class="group-title">App URL</div>
        <input class="url-input" id="urlInput" value="http://localhost:3000" spellcheck="false">
        <div class="btn-row">
            <button class="btn primary" id="loadBtn">Load</button>
            <button class="btn center" id="reloadBtn">Reload</button>
        </div>
    </div>

    <div>
        <div class="group-title">View</div>
        <label class="check"><input type="checkbox" id="fitCheck" checked> Fit to window</label>
        <label class="check" style="margin-top:8px"><input type="checkbox" id="touchCheck" checked> Touch mode (mouse acts as a finger)</label>
        <label class="check" style="margin:8px 0 0 22px"><input type="checkbox" id="hoverCheck" checked> Disable hover effects</label>
    </div>

    <div class="info" id="infoBox"></div>
</aside>

<!-- ============ Stage ============ -->
<main class="stage" id="stage">
    <div class="scale-wrap" id="scaleWrap">
        <div class="scale-inner" id="scaleInner"></div>
    </div>
</main>

<script>
/* ---------- Device definitions (portrait CSS pixel sizes of the whole screen) ---------- */
const DEVICES = {
    'android-phone':  { label: 'Android Phone',  w: 412,  h: 905,  bezel: 12, radius: 40, kind: 'android',        status: 32, nav: 48, defOrient: 'portrait'  },
    'android-tablet': { label: 'Android Tablet', w: 768,  h: 1024, bezel: 16, radius: 28, kind: 'android-tablet', status: 32, nav: 52, defOrient: 'landscape' },
    'iphone':         { label: 'iPhone',         w: 393,  h: 852,  bezel: 12, radius: 58, kind: 'iphone',         status: 54, nav: 34, defOrient: 'portrait'  },
    'ipad':           { label: 'iPad',           w: 820,  h: 1180, bezel: 18, radius: 34, kind: 'ipad',           status: 24, nav: 20, defOrient: 'landscape' },
    
    // Added Huawei Nova 14i definition
    'huawei-nova-14i': { 
        label: 'Huawei Nova 14i',
        // Physical panel: 1080 x 2376 px, 6.95", 20:9, ~376 ppi.
        // Measured on the real phone: screen 360 x 792 dp, device pixel ratio 3.0
        // (1080 / 3 = 360, 2376 / 3 = 792).
        w: 360,
        h: 792,
        bezel: 12,       // Fairly thick bezels, as on the real phone
        radius: 38,
        kind: 'android',
        camera: 'dot',   // small centered selfie camera cutout
        status: 36,      // EMUI status bar height (measured from a screenshot)
        nav: 38,         // 3-button navigation bar (measured from a screenshot)
        defOrient: 'portrait'
    }
};


const state = { device: 'huawei-nova-14i', orient: 'portrait', url: 'http://localhost:3000' };

/* ---------- SVG snippets ---------- */
const SVG = {
    circle:  '<svg class="ico" viewBox="0 0 24 24"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-2a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>',
    signal:  '<svg class="ico" viewBox="0 0 24 24"><path d="M2 22h20V2z"/></svg>',
    battery: '<svg class="ico" viewBox="0 0 24 24" style="transform:rotate(90deg);width:16px"><path d="M17 5H3a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zM23 9v6"/></svg>',
    iosSignal: '<svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>',
    iosWifi: '<svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.2a10 10 0 0 1 14 0"/><path d="M4.2 7a6 6 0 0 1 8.6 0"/><circle cx="8.5" cy="10" r="1" fill="#fff" stroke="none"/></svg>',
    iosBattery: '<svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="19" height="9" rx="2.2" fill="#fff"/><rect x="24" y="4" width="2" height="5" rx="1" fill="#fff" opacity=".5"/></svg>'
};

// Matches the real Nova 14i 3-button bar (left to right): Recents, Home, Back, Hide.
// Icons are drawn in dp units (1 SVG unit = 1 CSS px), 1.5dp stroke, 63dp apart.
/* Android (EMUI) status bar icons, matched to the real Nova 14i screenshot */
const AND = {
    timer: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.6V8l2.4 1.5"/></svg>',
    alarm: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke-linecap="round"><path d="M2 5.2A3.4 3.4 0 0 1 5 1.8M14 5.2A3.4 3.4 0 0 0 11 1.8" stroke="#fff" stroke-width="1.7"/><circle cx="8" cy="9" r="5.6" fill="#fff"/><path d="M8 6v3.2l2 1.3" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/></svg>',
    wifi: '<svg width="15" height="14" viewBox="0 0 16 14" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"><path d="M1 4.8Q8-1.4 15 4.8"/><path d="M3.6 7.9Q8 4 12.4 7.9"/><circle cx="8" cy="11.2" r="1.3" fill="#fff" stroke="none"/></svg>',
    bars: '<svg width="13" height="13" viewBox="0 0 13 13" fill="#fff"><rect x="0" y="9" width="2.4" height="4" rx=".8"/><rect x="3.5" y="6.2" width="2.4" height="6.8" rx=".8"/><rect x="7" y="3.4" width="2.4" height="9.6" rx=".8"/><rect x="10.5" y="0" width="2.4" height="13" rx=".8" opacity=".4"/></svg>',
    battery: (lvl) => `<svg width="25" height="13" viewBox="0 0 25 13"><rect x=".7" y=".7" width="21.6" height="11.6" rx="3.4" fill="none" stroke="#fff" stroke-width="1.4"/><rect x="23" y="4" width="1.8" height="5" rx=".9" fill="#fff"/><text x="11.5" y="9.6" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff" font-family="Roboto, Arial, sans-serif">${lvl}</text></svg>`
};

const NAV_ICONS = `
    <button class="nav-btn" aria-label="Recent apps"><svg width="20" height="20" viewBox="0 0 20 20"><rect class="nav-ico" x="2.5" y="2.5" width="15" height="15" rx="2.2"/></svg></button>
    <button class="nav-btn" aria-label="Home"><svg width="20" height="20" viewBox="0 0 20 20"><circle class="nav-ico" cx="10" cy="10" r="8.2"/></svg></button>
    <button class="nav-btn" aria-label="Back"><svg width="20" height="20" viewBox="0 0 20 20"><path class="nav-ico" d="M15.6 3.4 Q16.8 2.8 16.8 4.2 V15.8 Q16.8 17.2 15.6 16.6 L4.2 11.2 Q2.8 10 4.2 8.8 Z"/></svg></button>
    <button class="nav-btn" aria-label="Hide navigation"><svg width="20" height="20" viewBox="0 0 20 20"><path class="nav-ico" d="M4.5 3.2 H15.5 M4.5 6.6 H15.5 M5 10.6 L10 15.6 L15 10.6"/></svg></button>`;

/* ---------- Render ---------- */
function render() {
    const d = DEVICES[state.device];
    const landscape = state.orient === 'landscape';
    const sw = landscape ? d.h : d.w;
    const sh = landscape ? d.w : d.h;
    const isPhoneIOS = d.kind === 'iphone';
    const isIpad = d.kind === 'ipad';
    const isAndroidTab = d.kind === 'android-tablet';

    // iPhone landscape hides status bar like real iOS
    let statusH = d.status;
    let navH = d.nav;
    if (isPhoneIOS && landscape) { statusH = 0; navH = 21; }

    const screenRadius = Math.max(d.radius - d.bezel, 8);
    const frameW = sw + d.bezel * 2;
    const frameH = sh + d.bezel * 2;

    // Top bar
    let top = '';
    if (statusH > 0) {
        if (d.kind === 'android' || isAndroidTab) {
            top = `<div class="bar-top android ${isAndroidTab ? 'tablet' : ''}" style="height:${statusH}px">
                <div class="l"><span class="volte">VoLTE</span><span class="clock"></span></div>
                <div class="r">${AND.timer}${AND.alarm}${AND.wifi}<div class="net4g"><span>4G</span>${AND.bars}</div>${AND.battery(85)}</div>
            </div>`;
        } else if (isPhoneIOS) {
            top = `<div class="bar-top ios" style="height:${statusH}px">
                <div class="l"><span class="clock"></span></div>
                <div class="r">${SVG.iosSignal}${SVG.iosWifi}${SVG.iosBattery}</div>
            </div>`;
        } else if (isIpad) {
            top = `<div class="bar-top ipad" style="height:${statusH}px">
                <div class="l"><span class="clock"></span><span class="dateTxt" style="opacity:.9"></span></div>
                <div class="r">${SVG.iosWifi}<span>89%</span>${SVG.iosBattery}</div>
            </div>`;
        }
    }

    // Bottom bar
    let bottom = '';
    if (d.kind === 'android') {
        bottom = `<div class="bar-bottom nav-android" style="height:${navH}px">${NAV_ICONS}</div>`;
    } else if (isAndroidTab) {
        bottom = `<div class="bar-bottom nav-android tablet" style="height:${navH}px">${NAV_ICONS}</div>`;
    } else {
        const pillW = isIpad ? 160 : (landscape ? 140 : 134);
        bottom = `<div class="bar-bottom nav-ios" style="height:${navH}px"><div class="home-pill" style="width:${pillW}px;height:5px"></div></div>`;
    }

    // Dynamic island (iPhone)
    let island = '';
    if (isPhoneIOS) {
        island = landscape
            ? `<div class="dyn-island" style="width:34px;height:120px;left:12px;top:${(sh - 120) / 2}px"></div>`
            : `<div class="dyn-island" style="width:120px;height:34px;left:${(sw - 120) / 2}px;top:11px"></div>`;
    }

    // Selfie camera cutout (Huawei Nova 14i)
    let cam = '';
    if (d.camera === 'dot') {
        cam = landscape
            ? `<div class="dyn-island" style="width:14px;height:14px;left:10px;top:${(sh - 14) / 2}px;border-radius:50%"></div>`
            : `<div class="dyn-island" style="width:14px;height:14px;left:${(sw - 14) / 2}px;top:8px;border-radius:50%"></div>`;
    }

    const html = `
    <div class="device" style="width:${frameW}px;height:${frameH}px;padding:${d.bezel}px;border-radius:${d.radius}px">
        <div class="screen" style="width:${sw}px;height:${sh}px;border-radius:${screenRadius}px">
            ${island}${cam}
            ${top}
            <div class="app-area"><iframe id="appFrame" src="${escapeAttr(state.url)}" title="Dugout Pulse"></iframe></div>
            ${bottom}
        </div>
    </div>`;

    const inner = document.getElementById('scaleInner');
    inner.innerHTML = html;
    inner.dataset.w = frameW;
    inner.dataset.h = frameH;

    // Info panel
    const appW = sw;
    const appH = sh - statusH - navH;
    document.getElementById('infoBox').innerHTML =
        `<b>${d.label}</b> · ${state.orient}<br>` +
        `Screen: ${sw} × ${sh}<br>` +
        `App viewport: <b>${appW} × ${appH}</b><br>` +
        `<span id="scaleInfo"></span><br><span id="touchInfo"></span>`;

    // Re-apply touch mode whenever the app (re)loads in the frame
    const frameEl = document.getElementById('appFrame');
    setTouchStatus('Touch mode: waiting for app…');
    frameEl.addEventListener('load', () => { hoverStripped = false; installTouch(frameEl); });

    // Active button states
    document.querySelectorAll('[data-device]').forEach(b => b.classList.toggle('active', b.dataset.device === state.device));
    document.querySelectorAll('[data-orient]').forEach(b => b.classList.toggle('active', b.dataset.orient === state.orient));

    updateClock();
    applyScale();
}

function escapeAttr(s) { return s.replace(/"/g, '&quot;'); }

/* ---------- Scaling ---------- */
function applyScale() {
    const inner = document.getElementById('scaleInner');
    const wrap = document.getElementById('scaleWrap');
    const stage = document.getElementById('stage');
    const fw = +inner.dataset.w, fh = +inner.dataset.h;
    let scale = 1;
    if (document.getElementById('fitCheck').checked) {
        const availW = stage.clientWidth - 56;
        const availH = stage.clientHeight - 56;
        scale = Math.min(availW / fw, availH / fh, 1);
    }
    inner.style.transform = `scale(${scale})`;
    wrap.style.width = (fw * scale) + 'px';
    wrap.style.height = (fh * scale) + 'px';
    const si = document.getElementById('scaleInfo');
    if (si) si.textContent = `Display scale: ${Math.round(scale * 100)}%`;
}

/* ---------- Clock ---------- */
function updateClock() {
    const now = new Date();
    const t = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    document.querySelectorAll('.clock').forEach(el => el.textContent = t);
    const dt = now.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
    document.querySelectorAll('.dateTxt').forEach(el => el.textContent = dt);
}
setInterval(updateClock, 15000);

/* ---------- Touch mode: mouse behaves like a finger ---------- */
let touchCleanup = null;
let hoverStripped = false;

// Rewrites every :hover selector so it can never match (same-origin stylesheets only)
function neutralizeHover(doc) {
    const re = /:hover(?![\w-])/g;
    const fix = (rules) => {
        for (const r of rules) {
            try {
                if (r.selectorText && re.test(r.selectorText)) {
                    re.lastIndex = 0;
                    r.selectorText = r.selectorText.replace(re, ':not(*)');
                }
                re.lastIndex = 0;
                if (r.styleSheet && r.styleSheet.cssRules) fix(r.styleSheet.cssRules);
                if (r.cssRules && r.cssRules.length) fix(r.cssRules);
            } catch (e) { /* cross-origin or invalid rule: skip */ }
        }
    };
    const sheets = [...doc.styleSheets, ...(doc.adoptedStyleSheets || [])];
    for (const s of sheets) { try { fix(s.cssRules); } catch (e) { /* cross-origin sheet */ } }
}

function setTouchStatus(msg) {
    const el = document.getElementById('touchInfo');
    if (el) el.innerHTML = msg;
}

function removeTouch() {
    if (touchCleanup) { touchCleanup(); touchCleanup = null; }
}

function installTouch(frame) {
    removeTouch();
    if (!document.getElementById('touchCheck').checked) { setTouchStatus('Touch mode: off'); return; }

    let doc = null, win = null;
    try {
        win = frame.contentWindow;
        doc = frame.contentDocument || (win && win.document);
        if (doc) void doc.body;
    } catch (e) { doc = null; }

    if (!doc || !doc.documentElement) {
        setTouchStatus('Touch mode: <b>unavailable</b>. Your app is on a different origin than this page, so the browser blocks access. ' +
            'Put <code>device-preview.html</code> in your app\'s public folder and open it from your app\'s own address (e.g. localhost:3000/device-preview.html).');
        return;
    }

    // Styles: hide cursor + scrollbars, draw the finger dot
    const style = doc.createElement('style');
    style.textContent = `
        html, html * { cursor: none !important; }
        * { scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }
        img { -webkit-user-drag: none; }
        html.__dragging, html.__dragging * { user-select: none !important; -webkit-user-select: none !important; }
        #__touch_dot { position: fixed; z-index: 2147483647; width: 30px; height: 30px; margin: -15px 0 0 -15px;
            border-radius: 50%; background: rgba(120,120,120,.35); border: 2px solid rgba(255,255,255,.9);
            box-shadow: 0 0 0 1px rgba(0,0,0,.3); pointer-events: none; opacity: 0;
            transition: transform .08s, background .08s; }
        #__touch_dot.down { transform: scale(.8); background: rgba(0,194,203,.55); }`;
    (doc.head || doc.documentElement).appendChild(style);

    const dot = doc.createElement('div');
    dot.id = '__touch_dot';
    doc.documentElement.appendChild(dot);

    let down = false, moved = false, swallowClick = false;
    let sx = 0, sy = 0, lx = 0, ly = 0, lt = 0, vx = 0, vy = 0;
    let target = null, ex = null, ey = null, raf = 0;

    function scrollable(el, axis) {
        while (el && el.nodeType === 1) {
            const cs = win.getComputedStyle(el);
            const ov = axis === 'y' ? cs.overflowY : cs.overflowX;
            const can = axis === 'y' ? el.scrollHeight > el.clientHeight + 1 : el.scrollWidth > el.clientWidth + 1;
            if (can && /(auto|scroll|overlay)/.test(ov)) return el;
            el = el.parentElement;
        }
        return doc.scrollingElement;
    }

    function fireTouch(type, x, y) {
        try {
            const t = new win.Touch({
                identifier: 1, target, clientX: x, clientY: y,
                pageX: x + win.scrollX, pageY: y + win.scrollY, screenX: x, screenY: y,
                radiusX: 12, radiusY: 12, force: 0.5
            });
            const list = type === 'touchend' ? [] : [t];
            const ev = new win.TouchEvent(type, {
                bubbles: true, cancelable: true, composed: true,
                touches: list, targetTouches: list, changedTouches: [t]
            });
            target.dispatchEvent(ev);
            return ev.defaultPrevented;
        } catch (err) { return false; }
    }

    function glide() {
        vx *= 0.95; vy *= 0.95;
        if (Math.abs(vx) < 0.1 && Math.abs(vy) < 0.1) { raf = 0; return; }
        if (ey) ey.scrollTop -= vy;
        if (ex) ex.scrollLeft -= vx;
        raf = win.requestAnimationFrame(glide);
    }

    function endDrag() {
        if (!down) return;
        down = false;
        dot.classList.remove('down');
        doc.documentElement.classList.remove('__dragging');
        fireTouch('touchend', lx, ly);
        swallowClick = moved;
        setTimeout(() => { swallowClick = false; }, 0);
        if (moved) {
            if (performance.now() - lt > 80) { vx = 0; vy = 0; }
            raf = win.requestAnimationFrame(glide);
        }
    }

    const handlers = {
        mousedown(e) {
            if (e.button !== 0) return;
            if (raf) { win.cancelAnimationFrame(raf); raf = 0; }
            down = true; moved = false;
            sx = lx = e.clientX; sy = ly = e.clientY; lt = performance.now(); vx = vy = 0;
            target = e.target;
            ey = scrollable(target, 'y');
            ex = scrollable(target, 'x');
            dot.classList.add('down');
            fireTouch('touchstart', sx, sy);
        },
        mousemove(e) {
            dot.style.left = e.clientX + 'px';
            dot.style.top = e.clientY + 'px';
            dot.style.opacity = '1';
            if (!down) return;
            if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 6) {
                moved = true;
                doc.documentElement.classList.add('__dragging');
            }
            if (!moved) return;
            const sel = win.getSelection && win.getSelection();
            if (sel) sel.removeAllRanges();
            const now = performance.now();
            const dt = Math.max(now - lt, 1);
            const dx = e.clientX - lx, dy = e.clientY - ly;
            const prevented = fireTouch('touchmove', e.clientX, e.clientY);
            if (!prevented) {
                if (ey) ey.scrollTop -= dy;
                if (ex) ex.scrollLeft -= dx;
            }
            vx = vx * 0.5 + (dx / dt * 16) * 0.5;
            vy = vy * 0.5 + (dy / dt * 16) * 0.5;
            lx = e.clientX; ly = e.clientY; lt = now;
        },
        mouseup() { endDrag(); },
        click(e) {
            if (swallowClick) { e.preventDefault(); e.stopPropagation(); swallowClick = false; }
        },
        dragstart(e) { e.preventDefault(); }
    };

    for (const [type, fn] of Object.entries(handlers)) doc.addEventListener(type, fn, true);
    const leave = () => { dot.style.opacity = '0'; endDrag(); };
    doc.documentElement.addEventListener('mouseleave', leave);

    // ----- Hover suppression: a finger can't hover -----
    const hoverOn = document.getElementById('hoverCheck').checked;
    const hoverTypes = ['mouseover', 'mouseout', 'mouseenter', 'mouseleave',
                        'pointerover', 'pointerout', 'pointerenter', 'pointerleave'];
    const hoverBlock = (e) => { if (!down && e.target !== doc.documentElement) e.stopPropagation(); };
    const quietMouseMove = (e) => { if (!down) e.stopImmediatePropagation(); };
    const quietPointerMove = (e) => { if (!down && e.pointerType === 'mouse') e.stopImmediatePropagation(); };
    let hoverInterval = 0, hoverObserver = null, hoverTimeout = 0, origInsertRule = null, sheetProto = null;

    if (hoverOn) {
        neutralizeHover(doc);
        hoverStripped = true;
        hoverTypes.forEach(t => doc.addEventListener(t, hoverBlock, true));
        doc.addEventListener('mousemove', quietMouseMove, true);
        doc.addEventListener('pointermove', quietPointerMove, true);

        // Rules added later (CSS-in-JS, dev-server hot reload)
        try {
            sheetProto = win.CSSStyleSheet.prototype;
            origInsertRule = sheetProto.insertRule;
            sheetProto.insertRule = function (rule, index) {
                const r = typeof rule === 'string' ? rule.replace(/:hover(?![\w-])/g, ':not(*)') : rule;
                return origInsertRule.call(this, r, index);
            };
        } catch (e) { origInsertRule = null; }
        try {
            hoverObserver = new win.MutationObserver(muts => {
                const hit = muts.some(m => m.target.nodeName === 'STYLE' ||
                    [...m.addedNodes].some(n => n.nodeName === 'STYLE' || n.nodeName === 'LINK'));
                if (hit) {
                    win.clearTimeout(hoverTimeout);
                    hoverTimeout = win.setTimeout(() => neutralizeHover(doc), 50);
                }
            });
            hoverObserver.observe(doc.documentElement, { childList: true, subtree: true });
        } catch (e) { hoverObserver = null; }
        hoverInterval = win.setInterval(() => neutralizeHover(doc), 1500);
    }

    touchCleanup = () => {
        for (const [type, fn] of Object.entries(handlers)) doc.removeEventListener(type, fn, true);
        doc.documentElement.removeEventListener('mouseleave', leave);
        hoverTypes.forEach(t => doc.removeEventListener(t, hoverBlock, true));
        doc.removeEventListener('mousemove', quietMouseMove, true);
        doc.removeEventListener('pointermove', quietPointerMove, true);
        if (hoverObserver) hoverObserver.disconnect();
        if (hoverInterval) win.clearInterval(hoverInterval);
        if (hoverTimeout) win.clearTimeout(hoverTimeout);
        if (origInsertRule && sheetProto) sheetProto.insertRule = origInsertRule;
        if (raf) win.cancelAnimationFrame(raf);
        style.remove(); dot.remove();
        doc.documentElement.classList.remove('__dragging');
    };

    setTouchStatus('Touch mode: <b>on</b>' + (hoverOn ? ', hover effects disabled' : '') + '. Click and drag to scroll or swipe.');
}

function reapplyTouch() {
    const f = document.getElementById('appFrame');
    if (!f) return;
    const needHover = document.getElementById('touchCheck').checked && document.getElementById('hoverCheck').checked;
    if (hoverStripped && !needHover) {
        // Original CSS can only be restored by reloading the app; the load event re-applies the current settings
        removeTouch();
        hoverStripped = false;
        try { f.contentWindow.location.reload(); } catch (e) { f.src = f.src; }
        return;
    }
    installTouch(f);
}
document.getElementById('touchCheck').addEventListener('change', reapplyTouch);
document.getElementById('hoverCheck').addEventListener('change', reapplyTouch);

/* ---------- Events ---------- */
document.querySelectorAll('[data-device]').forEach(btn => {
    btn.addEventListener('click', () => {
        state.device = btn.dataset.device;
        state.orient = DEVICES[state.device].defOrient;
        render();
    });
});
document.querySelectorAll('[data-orient]').forEach(btn => {
    btn.addEventListener('click', () => { state.orient = btn.dataset.orient; render(); });
});
document.getElementById('rotateBtn').addEventListener('click', () => {
    state.orient = state.orient === 'portrait' ? 'landscape' : 'portrait';
    render();
});
document.getElementById('loadBtn').addEventListener('click', () => {
    state.url = document.getElementById('urlInput').value.trim() || state.url;
    render();
});
document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('loadBtn').click();
});
document.getElementById('reloadBtn').addEventListener('click', () => {
    const f = document.getElementById('appFrame');
    if (f) f.src = f.src;
});
document.getElementById('fitCheck').addEventListener('change', applyScale);
window.addEventListener('resize', applyScale);

render();
</script>
</body>
</html>
