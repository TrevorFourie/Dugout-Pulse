name: Android build verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Prepare build output directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path 'C:\Users\Trevor\Desktop\Other\Dugout-Pulse-Publish' -Force | Out-Null
      - name: Build and verify debug APK
        shell: pwsh
        run: .\build-apk.ps1
      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: dugout-pulse-debug-apk
          path: C:\Users\Trevor\Desktop\Other\Dugout-Pulse-Publish\Android-Package\*.apk
          if-no-files-found: error
          retention-days: 7
