name: Android build verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare the output directory expected by build-apk.ps1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'C:\Users\Trevor\Desktop\Other\Dugout-Pulse-Publish' -Force | Out-Null
          if (-not $env:ANDROID_HOME) {
            $candidate = Join-Path $env:LOCALAPPDATA 'Android\Sdk'
            if (Test-Path $candidate) { $env:ANDROID_HOME = $candidate }
          }
          if (-not $env:ANDROID_HOME -or -not (Test-Path (Join-Path $env:ANDROID_HOME 'platform-tools'))) {
            throw "Android SDK was not found on the Windows runner."
          }
          "ANDROID_HOME=$env:ANDROID_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "JAVA_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and verify debug APK
        shell: pwsh
        run: .\build-apk.ps1
