    <style>
      /* Android: keep the page transparent so the native full-screen splash (the
         Activity window background) stays visible until the app has rendered. */
      html.native-launch, html.native-launch body, html.native-launch #root { background-color: transparent !important; }
    </style>
    <script>
      // Match the saved Dugout Pulse theme before React or the startup fallback renders.
      (function () {
        var mode = 'system';
        try {
          var settings = JSON.parse(localStorage.getItem('baseball_hub_settings_v1') || '{}');
          if (settings && typeof settings.darkMode === 'string') mode = settings.darkMode;
        } catch (_) { /* Fall back to the system theme when saved settings cannot be read. */ }
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', Boolean(dark));
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = dark ? '#101419' : '#F4F6F8';
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute('content', dark ? '#101419' : '#F4F6F8');
      })();
    </script>
    <script>
      // Keep one startup-error presentation. Capture Vite's compile error before
      // the app entry module can execute, then show the actual error and report here.
      (function () {
        var fallbackShown = false;
        var capturedEvent = null;
        var storageKey = 'dugoutPulse.diagnostics.v1';

        function readEvents() {
          var events = [];
          try {
            var parsed = JSON.parse(localStorage.getItem(storageKey) || '[]');
            if (Array.isArray(parsed)) events = parsed;
          } catch (_) {
            // Try session diagnostics when persistent storage cannot be read.
          }
          try {
            var fallback = JSON.parse(sessionStorage.getItem('dugoutPulse.diagnostics.session.v1') || '[]');
            if (Array.isArray(fallback)) {
              var ids = new Set(events.map(function (item) { return item && item.id; }));
              fallback.forEach(function (item) {
                if (item && item.id && !ids.has(item.id)) {
                  events.push(item);
                  ids.add(item.id);
                }
              });
            }
          } catch (_) {
            // The in-memory bootstrap event can still be shown if all storage is unavailable.
          }
          return events.slice(-40);
        }

        function recordBootstrapFailure(messageText) {
          if (capturedEvent) return capturedEvent;
          var alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
          var id = 'DP-' + Array.from({ length: 6 }, function () {
            return alphabet[Math.floor(Math.random() * alphabet.length)];
          }).join('');
          var event = {
            id: id,
            time: new Date().toISOString(),
            category: 'app_startup',
            errorType: 'Error',
            errorMessage: messageText,
            userMessage: "Dugout Pulse couldn't start correctly. Don't reinstall or clear app data. Review the diagnostic report and restart the app.",
            frames: [],
            platform: /Android/i.test(navigator.userAgent) ? 'Android' : (/iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'iOS' : 'Web'),
            build: 'unknown'
          };
          capturedEvent = event;
          try {
            var events = readEvents();
            events.push(event);
            localStorage.setItem(storageKey, JSON.stringify(events.slice(-40)));
          } catch (_) {
            // The captured event remains available in memory for the report on this screen.
          }
          return event;
        }

        function showStartupFallback(event) {
          if (event) capturedEvent = event;
          if (fallbackShown) {
            var existingReference = document.getElementById('dp-error-reference');
            if (existingReference && capturedEvent && capturedEvent.id) {
              existingReference.textContent = 'Error reference: ' + capturedEvent.id;
            }
            return;
          }
          if (!document.body) return;
          fallbackShown = true;

          var latest = capturedEvent || null;
          var reference = latest && latest.id ? latest.id : 'unavailable';

          var panel = document.createElement('main');
          panel.setAttribute('role', 'alert');
          var darkTheme = document.documentElement.classList.contains('dark');
          var foreground = darkTheme ? '#FAFAFA' : '#18212D';
          var muted = darkTheme ? '#9CA3AF' : '#64748B';
          var border = darkTheme ? '#354050' : '#E2E8F0';
          var surface = darkTheme ? '#1A2028' : '#FFFFFF';
          panel.style.cssText = 'position:fixed;inset:0;z-index:2147483647;box-sizing:border-box;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.60);color:' + foreground + ';font-family:system-ui,sans-serif;';
          var card = document.createElement('section');
          card.style.cssText = 'box-sizing:border-box;width:100%;max-width:560px;padding:24px;border:1px solid ' + border + ';border-radius:18px;background:' + surface + ';box-shadow:0 24px 64px rgba(0,0,0,.24);';
          var heading = document.createElement('h1');
          heading.textContent = 'Dugout Pulse couldn’t start correctly';
          heading.style.cssText = 'font-size:22px;font-weight:700;line-height:1.25;color:' + foreground + ';margin:0 0 10px;';
          var errorKind = document.createElement('p');
          errorKind.textContent = '';
          errorKind.style.cssText = 'font-size:12px;line-height:1.5;color:' + muted + ';margin:0 0 8px;';
          var message = document.createElement('p');
          // Keep the on-screen failure message user-friendly. Raw compiler/runtime
          // details belong in the opt-in diagnostic report, not the primary error text.
          var friendlyMessages = {
            app_startup: "Dugout Pulse couldn't start correctly. Don't reinstall or clear app data. Open recovery tools if needed, and share the diagnostic report.",
            react_render: "Dugout Pulse encountered a screen error and had to stop this view. Your saved data may still be on this device. Avoid clearing app data and share the diagnostic report.",
            storage_load: "Dugout Pulse couldn't safely read some saved data. Don't reset or reinstall the app. Open recovery tools and check your recovery points.",
            storage_read: "Dugout Pulse couldn't safely read some saved data. Don't reset or reinstall the app. Open recovery tools and check your recovery points.",
            data_corruption: "Dugout Pulse couldn't safely read some saved data. Don't reset or reinstall the app. Open recovery tools and check your recovery points.",
            storage_write: "Dugout Pulse couldn't safely save a change. Pause further edits and check your recovery points before trying again.",
            storage_write_games: "Dugout Pulse couldn't safely save a change. Pause further edits and check your recovery points before trying again.",
            storage_write_profiles: "Dugout Pulse couldn't safely save a change. Pause further edits and check your recovery points before trying again.",
            storage_write_opposition_teams: "Dugout Pulse couldn't safely save a change. Pause further edits and check your recovery points before trying again.",
            backup_import: "Dugout Pulse couldn't safely import that backup. Don't reset the app. Review the diagnostic report before trying another import.",
            recovery_restore: "Dugout Pulse couldn't complete the restore. Do not clear app data or reinstall. Review the diagnostic report before another attempt.",
            recovery_checkpoint: "Dugout Pulse couldn't verify a recovery point. Avoid resetting or reinstalling the app; check for another verified recovery point.",
            data_reset: "Dugout Pulse couldn't complete the data reset safely. Do not repeat the reset yet. Review the diagnostic report and check your recovery points.",
            window_error: "Dugout Pulse encountered an unexpected technical problem. If the app is responsive, export the diagnostic report. Avoid clearing app data or reinstalling.",
            unhandled_rejection: "Dugout Pulse encountered an unexpected technical problem. If the app is responsive, export the diagnostic report. Avoid clearing app data or reinstalling.",
            network_failure: "A network request made by Dugout Pulse failed. This may be expected while offline; review the diagnostic report if the operation did not complete.",
            module_load_failure: "An optional part of Dugout Pulse could not load. Other features may still work; review the diagnostic report if you notice a problem.",
            runtime_error: "Dugout Pulse encountered an unexpected technical problem. If the app is responsive, export the diagnostic report. Avoid clearing app data or reinstalling.",
            native_failure: "Dugout Pulse encountered an unexpected technical problem. If the app is responsive, export the diagnostic report. Avoid clearing app data or reinstalling."
          };
          message.textContent = latest && typeof latest.userMessage === 'string'
            ? latest.userMessage
            : (latest && friendlyMessages[latest.category]
              ? friendlyMessages[latest.category]
              : "Dugout Pulse encountered a problem. Review the diagnostic report and avoid clearing app data until the cause is known.");
          message.style.cssText = 'font-size:14px;line-height:1.6;overflow-wrap:anywhere;color:' + (darkTheme ? '#FCA5A5' : '#B91C1C') + ';margin:0 0 12px;';
          // Technical types and source frames stay in the opt-in diagnostic report.
          errorKind.textContent = latest
            ? 'Technical details are available in the diagnostic report.'
            : 'The technical details could not be recorded.';
          var referenceText = document.createElement('p');
          referenceText.id = 'dp-error-reference';
          referenceText.textContent = 'Error reference: ' + reference;
          referenceText.style.cssText = 'font-size:12px;color:' + muted + ';margin-top:10px;';
          var reportButton = document.createElement('button');
          reportButton.type = 'button';
          reportButton.textContent = 'Show diagnostic report';
          reportButton.style.cssText = 'margin-top:12px;padding:10px 14px;border:0;border-radius:10px;background:' + (darkTheme ? '#00D7BC' : '#00BFA5') + ';color:#18212D;font-weight:600;cursor:pointer;';
          var report = document.createElement('textarea');
          report.readOnly = true;
          report.rows = 12;
          report.hidden = true;
          report.setAttribute('aria-label', 'Sanitised diagnostic report');
          report.style.cssText = 'box-sizing:border-box;width:100%;margin-top:12px;padding:10px;border-radius:8px;color:#111827;background:#fff;font:11px monospace;';
          reportButton.addEventListener('click', function () {
            report.hidden = !report.hidden;
            reportButton.textContent = report.hidden ? 'Show diagnostic report' : 'Hide diagnostic report';
            if (!report.hidden) {
              var selected = capturedEvent || null;
              report.value = JSON.stringify({
                reportFormat: 2,
                app: 'Dugout Pulse',
                appVersion: '1.0.0',
                build: selected && selected.build ? selected.build : 'unknown',
                platform: selected && selected.platform ? selected.platform : (/Android/i.test(navigator.userAgent) ? 'Android' : (/iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'iOS' : 'Web')),
                privacy: 'Offline report. No name, account ID, game data, player/team names, full user-agent, network address, or full file path is intentionally collected. Error messages are sanitised and truncated; review before sharing. Exact timestamps are included to help correlate errors with logs. Review before sharing.',
                events: selected ? [selected] : []
              }, null, 2);
              report.select();
            }
          });
          var recoveryButton = document.createElement('button');
          recoveryButton.type = 'button';
          recoveryButton.textContent = 'Open recovery tools';
          recoveryButton.style.cssText = 'margin:12px 8px 0 0;padding:10px 14px;border:1px solid ' + (darkTheme ? '#00D7BC' : '#007A6A') + ';border-radius:10px;background:transparent;color:' + (darkTheme ? '#00D7BC' : '#007A6A') + ';font-weight:600;cursor:pointer;';
          var recoveryCategories = ['storage_load', 'storage_read', 'data_corruption', 'storage_write', 'storage_write_games', 'storage_write_profiles', 'storage_write_opposition_teams', 'backup_import', 'recovery_checkpoint', 'recovery_restore', 'data_reset'];
          recoveryButton.hidden = !(latest && recoveryCategories.indexOf(latest.category) !== -1);
          recoveryButton.addEventListener('click', function () {
            var recoveryUrl = new URL('startup-recovery.html', document.baseURI);
            if (capturedEvent && capturedEvent.id) recoveryUrl.searchParams.set('ref', capturedEvent.id);
            window.location.href = recoveryUrl.toString();
          });
          var restartButton = document.createElement('button');
          restartButton.type = 'button';
          restartButton.textContent = 'Restart app';
          restartButton.style.cssText = 'margin:12px 8px 0 0;padding:10px 14px;border-radius:10px;border:1px solid ' + border + ';background:transparent;color:' + foreground + ';font-weight:600;cursor:pointer;';
          restartButton.addEventListener('click', function () { window.location.reload(); });
          var note = document.createElement('p');
          note.textContent = 'The report stays on this device. Nothing is sent automatically.';
          note.style.cssText = 'margin-top:14px;font-size:12px;line-height:1.5;color:' + muted + ';';
          card.append(heading, errorKind, message, referenceText, reportButton, recoveryButton, restartButton, report, note);
          panel.append(card);
          document.body.append(panel);
        }

        // This is the single error-screen entry point used by Vite startup
        // failures, the module bootstrap, global runtime handlers, and React.
        window.__dugoutPulseShowDiagnostic = function (reference) {
          var events = readEvents();
          var selected = events.find(function (item) { return item && item.id === reference; }) || null;
          if (selected) capturedEvent = selected;
          showStartupFallback(selected);
        };

        function captureViteCompileError(overlay) {
          try {
            var detailRoot = overlay && overlay.shadowRoot;
            if (!detailRoot) return null;
            var pieces = [];
            ['.message-body', '.message', '.file', '.frame', '.plugin', '.stack'].forEach(function (selector) {
              detailRoot.querySelectorAll(selector).forEach(function (node) {
                var value = (node.innerText || node.textContent || '').trim();
                if (value && pieces.indexOf(value) === -1) pieces.push(value);
              });
            });
            var detailText = pieces.join('\n');
            if (!detailText) detailText = detailRoot.innerText || detailRoot.textContent || '';
            if (!detailText) return null;

            // OXC/Vite often puts the useful parser explanation on a later line
            // than the generic "Transform failed" wrapper. Prefer that root cause.
            var parserMatch = detailText.match(/\[PARSE_ERROR\]\s*([^\r\n]+)/i) ||
              detailText.match(/(\bawait\b.{0,120}\bonly allowed within async functions\b[^\r\n]*)/i) ||
              detailText.match(/(Expected\s+.{1,100}?\s+but\s+found\s+.{1,100}?)(?:\r?\n|$)/i) ||
              detailText.match(/(Unexpected\s+(?:token|character|end of input).{0,140})/i);
            var messageNode = detailRoot.querySelector('.message-body, .message');
            var message = parserMatch && parserMatch[1] ? parserMatch[1].trim() :
              (messageNode ? (messageNode.innerText || messageNode.textContent || '').trim().split(/\r?\n/)[0] : '');
            if (!message || /Transform failed with \d+ error/i.test(message)) {
              message = 'Vite failed to transform a source module';
            }
            // Vite/OXC versions report locations in different formats: file:line:column
            // or "in src/file.tsx at startOffset..endOffset". Preserve either form.
            var location = detailText.match(/(?:src[\\/])?((?:[^/\\\s:\]]+[\\/])*[^/\\\s:\]]+\.(?:tsx?|jsx?)):(\d+):(\d+)/i);
            var offsetLocation = !location ? detailText.match(/\bin\s+((?:src[\\/])?[\w./\\-]+\.(?:tsx?|jsx?))\s+at\s+(\d+)\.\.(\d+)/i) : null;
            var file = location ? location[1].split(/[\\/]/).pop() : (offsetLocation ? offsetLocation[1].split(/[\\/]/).pop() : '');
            var line = location ? location[2] : '';
            var column = location ? location[3] : '';
            var locationDetail = location && file && line
              ? file + ':' + line + (column ? ':' + column : '')
              : (offsetLocation && file ? file + ' at characters ' + offsetLocation[2] + '-' + offsetLocation[3] : '');
            message = ('Vite compile error: ' + message + (locationDetail ? ' (' + locationDetail + ')' : ''))
              .replace(/[\r\n\t]+/g, ' ')
              .replace(/(["'])(?:src[\\/])?(?:[^"'\\/\s]+[\\/])+([^"'\\/\s]+\.(?:tsx?|jsx?|mjs|cjs|json))\1/gi, '$1$2$1')
              .replace(/(?:[A-Z]:)?[\\/](?:[^\s:'"<>]+[\\/])+([^\s\\/'"<>]+\.(?:tsx?|jsx?|mjs|cjs|json))/gi, '$1')
              .slice(0, 240);

            var events = readEvents();
            var alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            var id = 'DP-' + Array.from({ length: 6 }, function () {
              return alphabet[Math.floor(Math.random() * alphabet.length)];
            }).join('');
            var event = {
              id: id,
              time: new Date().toISOString(),
              category: 'app_startup',
              errorType: 'SyntaxError',
              errorMessage: message,
              userMessage: "Dugout Pulse couldn't start correctly. Don't reinstall or clear app data. Open recovery tools if needed, and share the diagnostic report.",
              frames: file && line ? [file + ':' + line + ':' + (column || '1')] : [],
              platform: /Android/i.test(navigator.userAgent) ? 'Android' : (/iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'iOS' : 'Web'),
              build: 'unknown'
            };
            events.push(event);
            try {
              localStorage.setItem(storageKey, JSON.stringify(events.slice(-40)));
            } catch (_) {
              // The visible diagnostic must still work if browser storage is unavailable.
            }
            return event;
          } catch (_) {
            return null;
          }
        }

        function detectViteOverlay() {
          var overlay = document.querySelector('vite-error-overlay');
          if (overlay) {
            var event = captureViteCompileError(overlay);
            overlay.remove();
            showStartupFallback(event || recordBootstrapFailure('A source module failed to compile before the app could start.'));
          }
        }
        if (typeof MutationObserver !== 'undefined') {
          new MutationObserver(detectViteOverlay).observe(document.documentElement, { childList: true, subtree: true });
        }
        window.addEventListener('vite:preloadError', function () {
          showStartupFallback(recordBootstrapFailure('An application module could not be loaded before startup completed.'));
        });
        window.addEventListener('error', function (event) {
          if (event.target && event.target.tagName === 'SCRIPT') {
            window.setTimeout(function () {
              detectViteOverlay();
              showStartupFallback(capturedEvent);
            }, 0);
          }
        }, true);
      })();
    </script>
    <script>
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
        document.documentElement.classList.add('native-launch');
      }
    </script>
  </head>

    <div id="root" class="h-full" style="min-height:100vh;"></div>
