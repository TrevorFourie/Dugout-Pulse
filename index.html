<html lang="en" class="h-full" style="background-color:#121923;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="description" content="Fast, lean, offline baseball and softball scorekeeping app for parents and players in the stands." />
    <meta property="og:title" content="Dugout Pulse - Personal Scorekeeping" />
    <meta property="og:description" content="Fast, lean, offline baseball and softball scorekeeping app for parents and players in the stands." />
    <meta property="og:image" content="/Logo.png" />
    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#101419" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Android: keep the page transparent so the native full-screen splash (the
         Activity window background) stays visible until the app has rendered. */
      html.native-launch, html.native-launch body, html.native-launch #root { background-color: transparent !important; }
    </style>
    <script>
      // Vite can fail while transforming/loading a module, before src/main.tsx
      // executes. In that case its React/app-level startup fallback cannot run.
      // Detect Vite's error overlay from this HTML bootstrap and show an app-branded
      // explanation while leaving the original Vite details available underneath.
      (function () {
        var fallbackShown = false;
        function showStartupFallback() {
          if (fallbackShown || !document.body) return;
          fallbackShown = true;
          var panel = document.createElement('section');
          panel.setAttribute('role', 'alert');
          panel.style.cssText = 'position:fixed;inset:0;z-index:2147483647;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:24px;background:#121923;color:#f8fafc;font-family:system-ui,sans-serif;';
          var card = document.createElement('div');
          card.style.cssText = 'box-sizing:border-box;width:100%;max-width:480px;padding:24px;border:1px solid #354050;border-radius:18px;background:#1a2028;';
          var heading = document.createElement('h1');
          heading.textContent = "Dugout Pulse couldn't start";
          heading.style.cssText = 'font-size:22px;margin:0 0 10px;';
          var message = document.createElement('p');
          message.textContent = 'Vite reported a module error before the app could load. The normal app startup handler could not run. The Vite error details are still available behind this message.';
          message.style.cssText = 'font-size:14px;line-height:1.6;color:#d1d5db;';
          var button = document.createElement('button');
          button.type = 'button';
          button.textContent = 'Show Vite error details';
          button.style.cssText = 'margin-top:12px;padding:10px 14px;border:0;border-radius:10px;background:#00d7bc;color:#101419;font-weight:600;cursor:pointer;';
          button.addEventListener('click', function () { panel.remove(); });
          card.append(heading, message, button);
          panel.append(card);
          document.body.append(panel);
        }
        function captureViteCompileError(overlay) {
          // Vite transform errors happen before src/main.tsx runs, so module-level
          // handlers cannot see the original parser message. Capture it from the overlay.
          try {
            var detailRoot = overlay && overlay.shadowRoot;
            var detailText = detailRoot ? (detailRoot.innerText || detailRoot.textContent || '') : '';
            if (!detailText) return;

            var parseMatch = detailText.match(/\[(?:PARSE_ERROR|ERROR)\]\s*([^\n]+)/i);
            var message = parseMatch ? parseMatch[1].trim() : '';
            var locationMatch = detailText.match(/(?:src\/)?([^/\\\s:\]]+\.(?:tsx?|jsx?)):(\d+):(\d+)/i);
            var file = locationMatch ? locationMatch[1] : 'unknown source';
            var line = locationMatch ? locationMatch[2] : '';
            var column = locationMatch ? locationMatch[3] : '';
            if (!message) {
              var fallbackMatch = detailText.match(/(?:SyntaxError|TypeError|ReferenceError):?\s*([^\n]+)/i);
              message = fallbackMatch ? fallbackMatch[1].trim() : 'Vite failed to transform a source module';
            }
            message = ('Vite compile error: ' + message + (line ? ' (' + file + ':' + line + (column ? ':' + column : '') + ')' : ''))
              .replace(/[\r\n\t]+/g, ' ')
              .replace(/(?:[A-Z]:)?[\\/](?:[^\s:'"<>]+[\\/])+([^\s\\/'"<>]+\.(?:tsx?|jsx?|mjs|cjs|json))/gi, '$1')
              .slice(0, 240);

            var storageKey = 'dugoutPulse.diagnostics.v1';
            var events = [];
            try {
              var stored = JSON.parse(localStorage.getItem(storageKey) || '[]');
              if (Array.isArray(stored)) events = stored;
            } catch (_) {}
            var time = new Date(Math.round(Date.now() / 900000) * 900000).toISOString();
            var event = {
              id: 'DP-' + Math.random().toString(36).slice(2, 8).toUpperCase().replace(/[^A-Z0-9]/g, 'X').padEnd(6, 'X').slice(0, 6),
              time: time,
              category: 'app_startup',
              errorType: 'SyntaxError',
              errorMessage: message,
              frames: line ? [file + ':' + line + ':' + (column || '1')] : [],
              platform: /Android/i.test(navigator.userAgent) ? 'Android' : (/iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'iOS' : 'Web'),
              build: 'unknown'
            };
            events.push(event);
            localStorage.setItem(storageKey, JSON.stringify(events.slice(-40)));
          } catch (_) {
            // Diagnostics must never prevent the startup fallback from being shown.
          }
        }

        function detectViteOverlay() {
          var overlay = document.querySelector('vite-error-overlay');
          if (overlay) {
            captureViteCompileError(overlay);
            showStartupFallback();
          }
        }
        if (typeof MutationObserver !== 'undefined') {
          new MutationObserver(detectViteOverlay).observe(document.documentElement, { childList: true, subtree: true });
        }
        window.addEventListener('vite:preloadError', showStartupFallback);
        window.addEventListener('error', function (event) {
          if (event.target && event.target.tagName === 'SCRIPT') {
            window.setTimeout(detectViteOverlay, 0);
          }
        }, true);
      })();
    </script>
    <script>
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
        document.documentElement.classList.add('native-launch');
      }
    </script>
  </head>
  <body style="margin:0;background-color:#121923;color:#FAFAFA;" class="h-full bg-[#F4F6F8] text-[#18212D] antialiased selection:bg-[#00BFA5] selection:text-[#18212D] dark:bg-[#101419] dark:text-[#E2E8F0]">
    <div id="root" class="h-full" style="min-height:100vh;background-color:#121923;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
