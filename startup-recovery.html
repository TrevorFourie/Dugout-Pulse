<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6F8" />
    <title>Dugout Pulse · Recovery</title>
    <script>
      (function () {
        var mode = 'system';
        try {
          var settings = JSON.parse(localStorage.getItem('baseball_hub_settings_v1') || '{}');
          if (settings && typeof settings.darkMode === 'string') mode = settings.darkMode;
        } catch (_) { /* Recovery remains available if saved settings cannot be read. */ }
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', Boolean(dark));
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute('content', dark ? '#101419' : '#F4F6F8');
      })();
    </script>
    <style>
      html, body, #startup-recovery-root { min-height:100%; margin:0; background:#F4F6F8; }
      body { color:#18212D; font-family:system-ui,sans-serif; }
      html.dark, html.dark body, html.dark #startup-recovery-root { background:#101419; color:#FAFAFA; }
    </style>
  </head>
  <body>
    <div id="startup-recovery-root"></div>
    <script type="module" src="/src/startupRecoveryEntry.tsx"></script>
  </body>
</html>
