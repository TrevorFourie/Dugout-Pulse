<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Tablet Device Mockup Preview</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        /* Landscape Android Tablet Outer Bezel Frame */
        .tablet-container {
            width: 1024px;
            height: 768px;
            background-color: #000000;
            border-radius: 28px;
            padding: 16px;
            box-shadow: 0px 30px 60px -15px rgba(0, 0, 0, 0.8);
            border: 4px solid #333333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Tablet Top Status Bar Layout */
        .status-bar {
            height: 32px;
            background-color: #000000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 500;
            user-select: none;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volte-tag {
            font-size: 10px;
            border: 1px solid #ffffff;
            padding: 1px 4px;
            border-radius: 3px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            width: 15px;
            height: 15px;
            fill: #ffffff;
        }

        /* Central Tablet Workspace Frame */
        .screen-content {
            flex: 1;
            background-color: #11141a;
            position: relative;
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            overflow: hidden;
        }

        /* Embedded Application Frame Workspace */
        .app-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: transparent;
        }

        /* Android Tablet Center-Dock Styled Navigation Bar */
        .navigation-bar {
            height: 52px;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 45px;
            padding: 0 20px;
        }

        .nav-button {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 44px;
            height: 44px;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .nav-button:hover {
            opacity: 1;
        }

        .nav-icon {
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <!-- Tablet Outer Frame Container -->
    <div class="tablet-container">
        
        <!-- Top Status Bar Area -->
        <div class="status-bar">
            <div class="status-left">
                <span class="volte-tag">VoLTE</span>
                <span>14:12</span>
            </div>
            <div class="status-right">
                <!-- Eye Protect Indicator icon -->
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-2a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>
                <!-- Wi-Fi / Cellular Signal Icon -->
                <svg class="icon" viewBox="0 0 24 24"><path d="M2 22h20V2z"/></svg>
                <!-- Battery Level Indicator Percentage -->
                <span>89</span>
                <svg class="icon" viewBox="0 0 24 24" style="transform: rotate(90deg); width: 16px;"><path d="M17 5H3a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zM23 9v6"/></svg>
            </div>
        </div>

        <!-- Central Viewport Display -->
        <div class="screen-content">
            <!-- REPLACE THE LINK BELOW WITH YOUR SECURE LIVE APP OR RUNNING LOCALHOST URL -->
            <iframe class="app-iframe" src="http://localhost:3000" title="Dugout Puls"></iframe>
        </div>

        <!-- Central Android Bottom Taskbar Navigation System -->
        <div class="navigation-bar">
            <!-- App Switcher / Overview (Square Icon) -->
            <button class="nav-button" aria-label="Recent Applications">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <rect class="nav-icon" x="3" y="3" width="18" height="18" rx="2" />
                </svg>
            </button>
            
            <!-- Home Key (Circle Icon) -->
            <button class="nav-button" aria-label="Home Screen">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <circle class="nav-icon" cx="12" cy="12" r="9" />
                </svg>
            </button>
            
            <!-- Back Command Button (Left Triangle Arrow Icon) -->
            <button class="nav-button" aria-label="Navigate Back">
                <svg width="18" height="18" viewBox="0 0 24 24" style="transform: rotate(-90deg);">
                    <polygon class="nav-icon" points="12,2 2,22 22,22" />
                </svg>
            </button>

            <!-- Down Arrow Utility Key / Keyboard Dismiss Icon -->
            <button class="nav-button" aria-label="Dismiss Overlay">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <polyline class="nav-icon" points="6,9 12,15 18,9" />
                </svg>
            </button>
        </div>

    </div>

</body>
</html>
