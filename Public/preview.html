<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mobile Preview</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    /* Hide desktop scrollbars while maintaining full scrollability */
    ::-webkit-scrollbar {
    display: none; /* Chrome, Safari, Edge */
    }

    * {
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;  /* Firefox */
    }
    /* Phone Mockup Frame */
    .device-phone {
      position: relative;
      width: 375px;
      height: 722px;
      background: #000;
      border-radius: 44px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border: 12px solid #2d2d2d;
      overflow: hidden;
      padding-top: 34px;
      padding-bottom: 34px;
    }
    /* iPhone Notch/Pill */
    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 28px;
      background: #000;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 10;
    }
    /* Embedded Live App */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="device-phone">
    <div class="notch"></div>
    <!-- Point directly to the root of your same Vite server -->
    <iframe src="/"></iframe>
  </div>

</body>
</html>
